<div class="section">
    <h2 class="section-title fade-in">Discography</h2>
    <div class="detail-flex fade-in">
        <div class="detail-left"><img id="d-jacket" src=""></div>
        <!-- ここにプレーヤーが自動注入されます -->
        <div class="detail-right" id="player-mount"></div>
    </div>
    <div class="grid-nav nav-4col quick-nav fade-in" id="disco-quick-nav" style="margin-top: 80px; padding-top: 40px; border-top: 1px solid #3a2a2a;"></div>
</div>

<script src="disco_data.js"></script>
<script src="player.js"></script> <!-- プレーヤー注入システム -->
<script src="common.js"></script>
<script>
    const discoId = new URLSearchParams(window.location.search).get('id') || 'fly-by';
    const data = discoData[discoId];
    if (data) {
        document.getElementById('d-jacket').src = data.jacket;
        mountPlayer(data); // プレーヤーを起動！
    }
    // クイックナビ生成ロジック（そのまま）
    const nav = document.getElementById('disco-quick-nav');
    Object.keys(discoData).forEach(key => {
        const item = discoData[key]; const a = document.createElement('a'); a.href = `discography.html?id=${key}`;
        a.className = 'grid-item'; a.innerHTML = `<div class="photo-box square"><img src="${item.jacket}"></div>`;
        nav.appendChild(a);
    });
</script>
