<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <title>Kiss-U Japan Official Site</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css?v=final">
</head>
<body id="top">
    <div id="loading"><div class="loading-logo">Kiss-U</div></div>
    <div id="common-header"></div>

    <div class="hero"></div>

    <section id="news" class="section fade-in">
        <h2 class="section-title">News</h2>
        <div id="top-news-container"></div>
        <div style="text-align:center;"><a href="detail.html?type=news" class="view-more-btn">View More</a></div>
    </section>

    <section id="profile" class="section fade-in">
        <h2 class="section-title">Profile</h2>
        <div class="grid-nav nav-5col" id="profile-grid"></div>
    </section>

    <section id="discography" class="section fade-in">
        <h2 class="section-title">Discography</h2>
        <div class="grid-nav nav-4col" id="disco-grid"></div>
    </section>

    <div id="common-footer"></div>

    <script src="profile.js"></script>
    <script src="discography.js"></script>
    <script src="news.js"></script>
    <script src="common.js"></script>
    <script>
        // ニュース1件表示
        if(newsData.length > 0) {
            document.getElementById('top-news-container').innerHTML = `<a href="${newsData[0].link}" class="news-item"><span class="news-date">${newsData[0].date}</span><span>${newsData[0].text}</span></a>`;
        }
        // グリッド生成
        const pGrid = document.getElementById('profile-grid');
        Object.keys(memberData).forEach(id => {
            pGrid.innerHTML += `<a href="detail.html?type=profile&id=${id}" class="grid-item"><div class="photo-box"><img src="${memberData[id].image}"></div><span>${id}</span></a>`;
        });
        const dGrid = document.getElementById('disco-grid');
        Object.keys(discoData).forEach(id => {
            const title = discoData[id].title.includes('"') ? discoData[id].title.split('"')[1] : discoData[id].title;
            dGrid.innerHTML += `<a href="detail.html?type=disco&id=${id}" class="grid-item"><div class="photo-box square"><img src="${discoData[id].jacket}"></div><span>${title}</span></a>`;
        });
    </script>
</body>
</html>
