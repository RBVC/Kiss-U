<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <title>Kiss-U Japan Official Site</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css?v=spa_fix2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body id="top">
    <div id="loading"><div class="loading-logo">Kiss-U</div></div>
    <div id="common-header"></div>

    <main id="home-view" class="view active">
        <div class="hero"></div>
        <section id="news" class="section">
            <h2 class="section-title">News</h2>
            <div id="top-news-container"></div>
            <div style="text-align: center;"><a class="view-more-btn" onclick="showView('news-view')" style="cursor:pointer;">View More</a></div>
        </section>
        <section id="profile-anchor" class="section">
            <h2 class="section-title">Profile</h2>
            <div class="grid-nav nav-5col" id="main-profile-grid"></div>
        </section>
        <section id="disco-anchor" class="section">
            <h2 class="section-title">Discography</h2>
            <div class="grid-nav nav-4col" id="main-disco-grid"></div>
        </section>
    </main>

    <main id="news-view" class="view">
        <section class="section">
            <h2 class="section-title">News</h2>
            <div id="full-news-list"></div>
        </section>
    </main>

    <main id="profile-detail-view" class="view">
        <section class="section">
            <h2 class="section-title">Profile</h2>
            <div class="detail-flex">
                <div class="detail-left"><img id="m-image" src=""></div>
                <div class="detail-right profile-info">
                    <h2 id="m-codename"></h2>
                    <ul class="profile-table">
                        <li><span class="label">Name</span><span class="value" id="m-name"></span></li>
                        <li><span class="label">Birthday</span><span class="value" id="m-birthday"></span></li>
                        <li><span class="label">Position</span><span class="value" id="m-position"></span></li>
                    </ul>
                </div>
            </div>
            <div class="quick-nav-area"><div class="grid-nav nav-5col" id="profile-quick-nav"></div></div>
        </section>
    </main>

    <main id="disco-detail-view" class="view">
        <section class="section">
            <h2 class="section-title">Discography</h2>
            <div class="detail-flex">
                <div class="detail-left"><img id="d-jacket" src=""></div>
                <div class="detail-right" id="player-mount"></div>
            </div>
            <div class="quick-nav-area"><div class="grid-nav nav-4col" id="disco-quick-nav"></div></div>
        </section>
    </main>

    <div id="common-footer"></div>

    <script src="profile.js"></script>
    <script src="discography.js"></script>
    <script src="news.js"></script>
    <script src="player.js"></script>
    <script src="common.js"></script>

    <script>
        // --- データ反映処理 ---
        const topNews = document.getElementById('top-news-container');
        const fullNews = document.getElementById('full-news-list');

        newsData.forEach((n, i) => {
            // リンク先からIDを抽出する（?id=xxx の形式を想定）
            let discoId = "";
            if(n.link.includes('id=')) discoId = n.link.split('id=')[1];

            const clickAction = discoId ? `onclick="openDisco('${discoId}')"` : "";
            const html = `<div class="news-item" ${clickAction} style="cursor:${discoId?'pointer':'default'};">
                            <span class="news-date">${n.date}</span>
                            <span>${n.text}</span>
                          </div>`;
            if(i === 0) topNews.innerHTML = html;
            fullNews.innerHTML += html;
        });

        const pGrid = document.getElementById('main-profile-grid');
        const pQuick = document.getElementById('profile-quick-nav');
        Object.keys(memberData).forEach(id => {
            const html = `<div class="grid-item" onclick="openProfile('${id}')">
                            <div class="photo-box"><img src="${memberData[id].image}"></div>
                            <span>${id}</span>
                          </div>`;
            const quickHtml = `<div class="grid-item" onclick="openProfile('${id}')">
                                <div class="photo-box square"><img src="${memberData[id].image}"></div>
                               </div>`;
            pGrid.innerHTML += html;
            pQuick.innerHTML += quickHtml;
        });

        const dGrid = document.getElementById('main-disco-grid');
        const dQuick = document.getElementById('disco-quick-nav');
        Object.keys(discoData).forEach(id => {
            const title = discoData[id].title.includes('"') ? discoData[id].title.split('"')[1] : discoData[id].title;
            const html = `<div class="grid-item" onclick="openDisco('${id}')">
                            <div class="photo-box square"><img src="${discoData[id].jacket}"></div>
                            <span>${title}</span>
                          </div>`;
            const quickHtml = `<div class="grid-item" onclick="openDisco('${id}')">
                                <div class="photo-box square"><img src="${discoData[id].jacket}"></div>
                               </div>`;
            dGrid.innerHTML += html;
            dQuick.innerHTML += quickHtml;
        });

        // --- 表示関数 ---
        function openProfile(id) {
            const d = memberData[id];
            if(!d) return;
            document.getElementById('m-codename').innerText = d.codename;
            document.getElementById('m-name').innerText = d.name;
            document.getElementById('m-birthday').innerText = d.birthday;
            document.getElementById('m-position').innerText = d.position;
            document.getElementById('m-image').src = d.image;
            showView('profile-detail-view');
        }

        function openDisco(id) {
            const d = discoData[id];
            if(!d) return;
            document.getElementById('d-jacket').src = d.jacket;
            mountPlayer(d); 
            showView('disco-detail-view');
        }
    </script>
</body>
</html>
